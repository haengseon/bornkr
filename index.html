<style>/* 스플래시: 번들보다 먼저 그려진다(흰 화면 깜빡임 방지). 색은 styles.css 토큰과 같은 값 */
#splash{--sb:#FBFAF5;--si:#1F2D28;--si2:#4F5C54;--sa:#204C3F;--sk1:#EFE6CE;--sk2:#F0D6C0;position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:max(16px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));background:var(--sb);color:var(--si);height:100vh;height:100dvh;transition:opacity .45s ease,transform .45s cubic-bezier(.2,.7,.2,1)}
@media (prefers-color-scheme:dark){html:not([data-theme="light"]) #splash{--sb:#1A1D21;--si:#E7E9EA;--si2:#BCC1C7;--sa:#9AAEFF;--sk1:#2A2F3A;--sk2:#3A2F33}}
html[data-theme="dark"] #splash{--sb:#1A1D21;--si:#E7E9EA;--si2:#BCC1C7;--sa:#9AAEFF;--sk1:#2A2F3A;--sk2:#3A2F33}
#splash.sp--out{opacity:0;transform:translateY(-28px);pointer-events:none}
#splash svg{width:min(100%,520px);height:auto;max-height:42dvh;display:block}
.sp__sky{fill:url(#sp-g)}.sp__ink{fill:var(--si)}.sp__line{fill:none;stroke:var(--si2);stroke-width:1.5;stroke-dasharray:3 5;stroke-linecap:round}
.sp__ground{stroke:var(--si);stroke-width:2;stroke-linecap:round}.sp__sun{fill:var(--sa)}.sp__soft{fill:var(--si2);opacity:.28}
.sp__win{fill:var(--sa);opacity:.85}
.sp__t{margin:0;font-family:"Nanum Myeongjo","AppleMyungjo","Batang","바탕",serif;font-weight:800;font-size:clamp(30px,9vw,52px);line-height:1.2;text-align:center;letter-spacing:.02em}
.sp__t span{display:inline-block;opacity:0;animation:sp-in .55s ease forwards;animation-delay:calc(.5s + var(--i)*70ms)}
.sp__s{margin:0;font:500 15px/1.4 "Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:var(--si2);letter-spacing:.08em;opacity:0;animation:sp-in .6s ease 1.3s forwards}
.sp__fig{opacity:0;animation:sp-in .6s ease forwards;animation-delay:calc(.3s + var(--n)*.3s)}
.sp__orb{offset-path:path("M30 176 Q180 -34 330 176");offset-rotate:0deg;animation:sp-orb 2.2s ease-in-out .2s both}
.sp__bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:transparent}
.sp__bar i{display:block;height:100%;background:var(--sa);transform:scaleX(0);transform-origin:left;transition:transform 1.9s cubic-bezier(.3,.6,.3,1)}
.sp__hint{margin:6px 0 0;font:500 14px/1.4 "Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:var(--si2);letter-spacing:.06em;opacity:0;animation:sp-in .6s ease 2.2s forwards,sp-blink 1.8s ease-in-out 2.9s infinite}
@keyframes sp-blink{0%,100%{opacity:.95}50%{opacity:.35}}
#splash{cursor:pointer}
@keyframes sp-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sp-orb{from{offset-distance:0%}to{offset-distance:100%}}
html[data-motion="reduce"] #splash .sp__hint,html[data-motion="off"] #splash .sp__hint{animation:none;opacity:1}
html[data-motion="reduce"] #splash .sp__t span,html[data-motion="reduce"] #splash .sp__s,html[data-motion="reduce"] #splash .sp__fig,html[data-motion="off"] #splash .sp__t span,html[data-motion="off"] #splash .sp__s,html[data-motion="off"] #splash .sp__fig{animation:none;opacity:1}
html[data-motion="reduce"] #splash .sp__orb,html[data-motion="off"] #splash .sp__orb{animation:none;offset-distance:50%}
html[data-motion="reduce"] #splash,html[data-motion="off"] #splash{transition:opacity .2s}
html[data-motion="reduce"] #splash.sp--out,html[data-motion="off"] #splash.sp--out{transform:none}
@media (prefers-reduced-motion:reduce){#splash .sp__t span,#splash .sp__s,#splash .sp__fig{animation:none;opacity:1}#splash .sp__orb{animation:none;offset-distance:50%}#splash,#splash.sp--out{transition:opacity .2s;transform:none}}
</style>
<link rel="stylesheet" href="styles.css">
<script>/* 깜빡임 방지: 저장된 테마·모션을 CSS보다 먼저 */
try { const s = JSON.parse(localStorage.getItem('hj.v1.settings') || '{}');
  if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
  if (s.reduceMotion) document.documentElement.dataset.motion = 'reduce'; } catch {}
try { if (new URLSearchParams(location.search).get('motion') === 'off') document.documentElement.dataset.motion = 'off'; } catch {}

<script>
(function () {
  var d = document, root = d.documentElement, el = d.getElementById('splash'); if (!el) return;
  var skip = false;
  try { if (navigator.webdriver && !/[?&]splash=1/.test(location.search)) skip = true; if (sessionStorage.getItem('hj.splash')) skip = true; sessionStorage.setItem('hj.splash', '1'); } catch (e) {}
  if (skip) { el.remove(); return; }
  var reduce = !!(root.dataset.motion) || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches), resume = false;
  try { resume = !!localStorage.getItem('hj.v1.current'); } catch (e) {}
  var done = false, bar = el.querySelector('.sp__bar i');
  function A() { return d.getElementById('app'); }
  d.addEventListener('DOMContentLoaded', function () { try { if (!done) A().inert = true; } catch (e) {} });
  bar.style.transitionDuration = '1800ms';
  requestAnimationFrame(function () { bar.style.transform = 'scaleX(1)'; });
  function finish() {
    if (done) return; done = true;
    el.classList.add('sp--out'); try { A().inert = false; } catch (e) {}
    d.body.classList.add('splash-out');
    setTimeout(function () { el.remove(); d.body.classList.remove('splash-out'); var h = d.querySelector('#app h1'); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); } }, reduce ? 220 : 520);
  }
  // 자동으로 넘어가지 않는다: 화면을 터치(클릭)하거나 Enter/Space를 눌러야 시작.
  window.__splashReady = function () {};
  el.addEventListener('click', finish);
  el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); finish(); } });
  try { el.focus({ preventScroll: true }); } catch (e) {}
})();
</script>
