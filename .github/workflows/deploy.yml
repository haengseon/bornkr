# main 브랜치에 푸시되면 빌드해서 S3에 올리고 CloudFront 캐시를 갱신한다.
# 인증: 저장소 Secrets 의 AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (키가 없으면 배포 단계는 건너뛴다).
# 선택 변수(Variables): S3_BUCKET(기본 bornkr-static-resource), AWS_REGION(기본 ap-northeast-2), CLOUDFRONT_DISTRIBUTION_ID
name: S3 deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  BUCKET: ${{ vars.S3_BUCKET || 'bornkr-static-resource' }}
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:site

      - name: 공개 문서·광고 배치 경계 검증
        run: npm run test:site

      - name: AWS 키 설정 여부 확인
        id: keys
        env:
          KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -n "$KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::warning::AWS_ACCESS_KEY_ID Secret이 없어 배포를 건너뜁니다."; fi

      - name: Configure AWS credentials
        if: steps.keys.outputs.ok == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        if: steps.keys.outputs.ok == 'true'
        run: aws sts get-caller-identity

      - name: 해시 붙은 JS·CSS 업로드(1년 캐시)
        if: steps.keys.outputs.ok == 'true'
        run: |
          aws s3 sync dist/site s3://$BUCKET \
            --exclude "*.html" --exclude "*.txt" --exclude "*.xml" --exclude "site.css" \
            --exclude "manifest.webmanifest" --exclude "icon*" --exclude "apple-touch-icon.png" --exclude "favicon*" \
            --cache-control "public,max-age=31536000,immutable"

      - name: 고정 이름 파일 업로드(올바른 콘텐츠 타입·짧은 캐시)
        if: steps.keys.outputs.ok == 'true'
        run: |
          B=s3://$BUCKET
          for f in dist/site/*.html; do aws s3 cp "$f" "$B/$(basename "$f")" --cache-control "no-cache" --content-type "text/html; charset=utf-8"; done
          for f in dist/site/*.txt; do aws s3 cp "$f" "$B/$(basename "$f")" --cache-control "public,max-age=3600" --content-type "text/plain; charset=utf-8"; done
          aws s3 cp dist/site/sitemap.xml $B/sitemap.xml --cache-control "public,max-age=3600" --content-type "application/xml; charset=utf-8"
          aws s3 cp dist/site/site.css $B/site.css --cache-control "public,max-age=3600" --content-type "text/css; charset=utf-8"
          aws s3 cp dist/site/manifest.webmanifest $B/manifest.webmanifest --cache-control "public,max-age=3600" --content-type "application/manifest+json"
          for f in dist/site/icon*.svg; do [ -f "$f" ] && aws s3 cp "$f" $B/$(basename "$f") --cache-control "public,max-age=86400" --content-type "image/svg+xml"; done
          for f in dist/site/icon*.png dist/site/apple-touch-icon.png dist/site/favicon*; do [ -f "$f" ] && aws s3 cp "$f" $B/$(basename "$f") --cache-control "public,max-age=86400"; done
          true

      - name: 이전 빌드의 해시 JS·CSS 정리
        if: steps.keys.outputs.ok == 'true'
        run: |
          # 새 HTML 업로드 후 현재 빌드에 없는 해시 파일만 삭제한다.
          aws s3 sync dist/site "s3://$BUCKET" --delete \
            --exclude "*" \
            --include "app.*.js" --include "app.*.css" --include "content-ads.*.js" \
            --cache-control "public,max-age=31536000,immutable"

      - name: CloudFront 캐시 갱신
        if: steps.keys.outputs.ok == 'true' && vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/" "/index.html" "/guide.html" "/how-it-works.html" "/about.html" "/contact.html" "/privacy.html" "/robots.txt" "/sitemap.xml" "/site.css" "/ads.txt" "/manifest.webmanifest"
